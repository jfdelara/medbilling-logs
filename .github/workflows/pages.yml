name: Publish site to gh-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import site bundle (if .deploy/bundle.txt present)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f .deploy/bundle.txt ]; then
            read -r URL SHA < .deploy/bundle.txt
            curl -sSfL -o /tmp/bundle.tgz "$URL"
            echo "$SHA  /tmp/bundle.tgz" | sha256sum -c -
            rm -rf site && mkdir site
            tar -xzf /tmp/bundle.tgz -C site
            touch site/.nojekyll
            git rm -q .deploy/bundle.txt
            git add -A site
            git commit -m "Import site bundle $SHA"
            git push origin HEAD:main
          fi
          test -f site/index.html
      - name: Assemble published site (landing + /export/ + /web/)
        run: |
          set -euo pipefail
          python3 scripts/ci/cf-bundle.py --src public --site site --out dist-pages --no-sw-patch
          test -f dist-pages/index.html
          test -f dist-pages/privacy.html
          test -f dist-pages/export/index.html
          test -f dist-pages/web/index.html
          test -f dist-pages/web/js/web-preview.js
      - name: Push assembled site to pages-src and gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .publish-tmp
          mkdir .publish-tmp
          cp -a dist-pages/. .publish-tmp/
          git -C .publish-tmp init
          git -C .publish-tmp checkout -b pages-tmp
          git -C .publish-tmp add -A
          git -C .publish-tmp -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Publish assembled MedBilling Logs site"
          git -C .publish-tmp remote add origin "$(git remote get-url origin)"
          AUTH=$(git config --get http.https://github.com/.extraheader || true)
          if [ -n "$AUTH" ]; then
            git -C .publish-tmp -c http.https://github.com/.extraheader="$AUTH" push -f origin pages-tmp:refs/heads/pages-src
            git -C .publish-tmp -c http.https://github.com/.extraheader="$AUTH" push -f origin pages-tmp:refs/heads/gh-pages
          else
            git -C .publish-tmp push -f origin pages-tmp:refs/heads/pages-src
            git -C .publish-tmp push -f origin pages-tmp:refs/heads/gh-pages
          fi
